<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Confirmation — AirVAS</title>
<style>
:root {
  --bg: #f0f6ff; --card: #fff; --accent: #0ea5e9; --accent2: #0284c7;
  --success: #16a34a; --danger: #dc2626; --warning: #d97706;
  --partial: #f59e0b;
  --text1: #0f172a; --text2: #475569; --text3: #94a3b8; --border: #e2e8f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text1);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100dvh; max-width: 520px; margin: 0 auto; padding: 20px; }

.brand { text-align: center; padding: 20px 0 30px; }
.brand .logo { font-size: 22px; font-weight: 800; color: var(--accent); }
.brand .sub { font-size: 11px; color: var(--text3); letter-spacing: 1.5px;
  text-transform: uppercase; margin-top: 4px; }

/* Banner — adapts to payment status (paid / partial / unpaid) */
.banner { border-radius: 16px; padding: 28px 20px; text-align: center;
  margin-bottom: 16px; color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.banner .icon { font-size: 48px; margin-bottom: 8px; }
.banner h1 { font-size: 22px; font-weight: 800; }
.banner p { font-size: 14px; opacity: 0.92; margin-top: 6px; }
.banner-paid    { background: linear-gradient(135deg, var(--success), #15803d); }
.banner-partial { background: linear-gradient(135deg, var(--partial), #b45309); }
.banner-unpaid  { background: linear-gradient(135deg, var(--warning), #b45309); }

/* Outstanding balance callout — appears for partial/unpaid orders */
.balance-callout {
  background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px;
  padding: 14px 16px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 12px;
}
.balance-callout .ico { font-size: 24px; flex-shrink: 0; }
.balance-callout .txt { flex: 1; font-size: 13px; color: #92400e; line-height: 1.4; }
.balance-callout .txt strong { font-size: 15px; color: #78350f; }
.balance-callout .amt { font-family: monospace; font-weight: 700; font-size: 18px; color: #b45309; white-space: nowrap; }

.card { background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.card-title { font-size: 11px; font-weight: 700; color: var(--text2);
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
.info-row { display: flex; justify-content: space-between; padding: 6px 0;
  border-bottom: 1px solid var(--border); font-size: 14px; gap: 10px; }
.info-row:last-child { border-bottom: none; }
.info-row .lbl { color: var(--text3); flex-shrink: 0; }
.info-row .val { font-weight: 600; text-align: right; }
.info-row .val-due { color: var(--partial); font-family: monospace; }
.info-row .val-paid { color: var(--success); }

.ref-box { background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
  border: 1px solid #bae6fd; border-radius: 12px; padding: 16px;
  text-align: center; margin-bottom: 14px; }
.ref-box .lbl { font-size: 11px; color: var(--text3);
  text-transform: uppercase; letter-spacing: .5px; }
.ref-box .val { font-size: 22px; font-weight: 800; color: var(--accent);
  margin-top: 4px; font-family: monospace; }


/* Payment history rows */
.payment-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.payment-row:last-child { border-bottom: none; }
.payment-row .pay-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.payment-row .pay-icon.cash    { background: #dcfce7; color: #166534; }
.payment-row .pay-icon.card    { background: #dbeafe; color: #1d4ed8; }
.payment-row .pay-icon.online  { background: #ede9fe; color: #7c3aed; }
.payment-row .pay-info { flex: 1; min-width: 0; }
.payment-row .pay-info .pay-method { font-size: 13px; font-weight: 600; color: var(--text1); }
.payment-row .pay-info .pay-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
.payment-row .pay-amount {
  font-family: monospace; font-weight: 700; font-size: 15px;
  color: var(--success); white-space: nowrap;
}

/* Payment summary footer in the breakdown card */
.pay-summary {
  margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--border);
  display: flex; justify-content: space-between; font-size: 14px;
}
.pay-summary .lbl { color: var(--text2); font-weight: 600; }
.pay-summary .val { font-weight: 700; font-family: monospace; }


@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }


#errorScreen, #loadingScreen { text-align: center; padding: 60px 20px; }
.error-icon { font-size: 56px; }
.error-title { font-size: 20px; font-weight: 700; margin-top: 12px; }
.error-sub { font-size: 14px; color: var(--text2); margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>

<div class="brand">
  <div class="logo">✈ AirVAS</div>
  <div class="sub">Payment receipt</div>
</div>

<div id="loadingScreen">
  <div style="font-size:48px;animation:spin 1.5s linear infinite">⟳</div>
  <div class="error-title" style="color:var(--text2)">Loading your order…</div>
</div>

<div id="content" style="display:none">

  <div class="banner" id="banner">
    <div class="icon" id="bannerIcon">✅</div>
    <h1 id="successTitle">Payment Successful</h1>
    <p id="successSub">Your service is being arranged now.</p>
  </div>

  <!-- Outstanding balance callout — only shown when there's a balance due -->
  <div class="balance-callout" id="balanceCallout" style="display:none">
    <div class="ico">💰</div>
    <div class="txt">
      <strong>Balance due</strong><br>
      <span id="balanceMsg">Please complete payment to proceed.</span>
    </div>
    <div class="amt" id="balanceAmt">—</div>
  </div>

  <div class="ref-box">
    <div class="lbl">Order Reference</div>
    <div class="val" id="orderRef">—</div>
  </div>

  <div class="card">
    <div class="card-title">Order Details</div>
    <div id="orderInfo"></div>
  </div>

  <!-- Payment history — appears whenever any payment row exists -->
  <div class="card" id="paymentHistoryCard" style="display:none">
    <div class="card-title">Payments</div>
    <div id="paymentHistory"></div>
    <div class="pay-summary" id="paymentSummary"></div>
  </div>

  <div style="text-align:center;color:var(--text3);font-size:13px;padding:20px 0">
    Thank you for using AirVAS — safe travels!
  </div>
</div>

<div id="errorScreen" style="display:none">
  <div class="error-icon">⚠️</div>
  <div class="error-title">Couldn't Load Order</div>
  <div class="error-sub" id="errorMsg">Please check your tracking link.</div>
</div>

<script>
const API = location.origin + '/api';
const params = new URLSearchParams(location.search);
// New short URL: ?t=<token>. Legacy: ?order=<id>&token=<token>.
// Either is accepted — `token` is the only thing the server actually needs.
const token   = params.get('t') || params.get('token');
let orderId   = params.get('order') || '';   // may be missing in short form

const loadingEl = document.getElementById('loadingScreen');
const contentEl = document.getElementById('content');
const errorEl   = document.getElementById('errorScreen');

let verifyAttempted = false;

function showError(msg) {
  loadingEl.style.display = 'none';
  contentEl.style.display = 'none';
  errorEl.style.display = 'block';
  document.getElementById('errorMsg').textContent = msg;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Parse a MySQL-format datetime (no Z) as UTC, return Date or null
function parseUtc(dt) {
  if (!dt) return null;
  const isoSafe = /Z|[+-]\d{2}:?\d{2}$/.test(dt) ? dt : dt.replace(' ', 'T') + 'Z';
  const d = new Date(isoSafe);
  return isNaN(d.getTime()) ? null : d;
}

// Relative ("just now", "5m ago") + absolute time ("at 14:32")
function fmtTime(dt) {
  const d = parseUtc(dt);
  if (!d) return '';
  const now = new Date();
  const diffSec = (now - d) / 1000;

  let relative;
  if (diffSec < 60)         relative = 'just now';
  else if (diffSec < 3600)  relative = Math.round(diffSec/60) + 'm ago';
  else if (diffSec < 86400) relative = Math.round(diffSec/3600) + 'h ago';
  else                      relative = d.toLocaleDateString('en-AE', {day:'numeric', month:'short'});

  const time = d.toLocaleTimeString('en-AE', {hour: '2-digit', minute: '2-digit'});

  // For < 24h, show "5m ago · 14:32"; for older, show "12 May · 14:32"
  if (diffSec < 86400) {
    return relative + ' · ' + time;
  }
  return relative + ' · ' + time;
}

// Short formatter for per-service rows
function fmtShort(dt) {
  const d = parseUtc(dt);
  if (!d) return '';
  return d.toLocaleString('en-AE', {
    day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit'
  });
}

// Format an AED amount with 2 decimals
function fmtAed(n) {
  return 'AED ' + parseFloat(n || 0).toFixed(2);
}

async function loadOrder() {
  if (!token) {
    showError('Invalid or missing tracking link.');
    return;
  }

  // On first load only, verify with Stripe (in case the customer just paid)
  if (!verifyAttempted) {
    verifyAttempted = true;
    try {
      await fetch(`${API}/customer/verify-payment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // order_id may be empty when arriving via short URL — server
        // resolves it from token alone.
        body: JSON.stringify({ order_id: orderId, token: token })
      });
    } catch (e) { /* non-fatal */ }
  }

  try {
    // Prefer the token-only endpoint when we don't have an order_id.
    // Either path returns the same payload.
    const url = orderId
      ? `${API}/customer/booking/${orderId}?token=${encodeURIComponent(token)}`
      : `${API}/customer/booking-by-token/${encodeURIComponent(token)}`;
    const res = await fetch(url);
    const json = await res.json();
    if (!res.ok || !json?.data) {
      showError(json?.error || 'This tracking link is invalid or expired.');
      return;
    }
    // Cache order_id from the response so any re-fetches use the fast path
    orderId = json.data.id || orderId;
    render(json.data);
  } catch (e) {
    showError('Connection error — please try again.');
  }
}

function render(order) {
  loadingEl.style.display = 'none';
  contentEl.style.display = 'block';

  const total   = parseFloat(order.total_amount || 0);
  const paid    = parseFloat(order.paid_amount  || 0);
  const balance = Math.max(0, total - paid);

  // Banner — three states now: paid / partial / unpaid
  const banner = document.getElementById('banner');
  banner.className = 'banner';
  const status = order.payment_status;
  if (status === 'paid') {
    banner.classList.add('banner-paid');
    document.getElementById('bannerIcon').textContent = '✅';
    document.getElementById('successTitle').textContent = 'Payment Successful';
    document.getElementById('successSub').textContent = 'Your service is being arranged now.';
  } else if (status === 'partial') {
    banner.classList.add('banner-partial');
    document.getElementById('bannerIcon').textContent = '◐';
    document.getElementById('successTitle').textContent = 'Partial Payment Received';
    document.getElementById('successSub').textContent =
      `${fmtAed(paid)} received · ${fmtAed(balance)} still due. Service will start once payment is complete.`;
  } else {
    banner.classList.add('banner-unpaid');
    document.getElementById('bannerIcon').textContent = '⏳';
    document.getElementById('successTitle').textContent = 'Awaiting Payment';
    document.getElementById('successSub').textContent = 'Refreshing automatically — please complete payment to proceed.';
  }

  // Outstanding balance callout — visible when any balance remains
  const callout = document.getElementById('balanceCallout');
  if (balance > 0.005) {
    callout.style.display = 'flex';
    document.getElementById('balanceAmt').textContent = fmtAed(balance);
    document.getElementById('balanceMsg').textContent = status === 'partial'
      ? 'Pay the remaining balance to your team leader on arrival, or via the link they share with you.'
      : 'Complete payment to start the service. Your team leader will share a payment link with you.';
  } else {
    callout.style.display = 'none';
  }

  // Order Reference — the real, canonical order_number from the database
  // (e.g. "1034"). This is the same value the TL sees on their slip and
  // admin sees in the Orders table. Customers quote it verbatim.
  // Fallback to the legacy UUID-slice format only if order_number is
  // missing — which shouldn't happen but keeps the page from breaking.
  const refText = order.order_number
    ? String(order.order_number)
    : 'AP-' + order.id.slice(0, 6).toUpperCase();
  document.getElementById('orderRef').textContent = refText;

  // Order Details — derive the service name from the services array; the
  // legacy "plate === PORTER" hack doesn't work now that plate is null for
  // customer bookings. Pick the icon by the service name.
  const firstSvc = Array.isArray(order.services) && order.services.length
                 ? order.services[0] : null;
  const svcName  = firstSvc?.service_name || 'Service';
  const svcIcon  = /porter/i.test(svcName) ? '🧳' : '🚗';
  // Order details — Vehicle + Customer rows removed; flow no longer
  // collects them. The customer is on their own tracking page already
  // (got here via their unique token), so name confirmation is moot.
  document.getElementById('orderInfo').innerHTML = `
    <div class="info-row"><span class="lbl">Service</span><span class="val">${svcIcon} ${escapeHtml(svcName)}</span></div>
    <div class="info-row"><span class="lbl">Total</span><span class="val">${fmtAed(total)}</span></div>
    <div class="info-row"><span class="lbl">Paid so far</span><span class="val val-paid">${fmtAed(paid)}</span></div>
    ${balance > 0.005
      ? `<div class="info-row"><span class="lbl">Balance due</span><span class="val val-due">${fmtAed(balance)}</span></div>`
      : ''}
    <div class="info-row"><span class="lbl">Booked</span><span class="val" style="font-size:12px">${fmtShort(order.created_at)}</span></div>
  `;

  renderPaymentHistory(order, total, paid, balance);
}

// Payment history — shows each successful payment row with method + amount + time.
// Visible whenever there's at least one payment, useful for both partial and paid
// orders so customers can see exactly what they've paid.
function renderPaymentHistory(order, total, paid, balance) {
  const payments = Array.isArray(order.payments) ? order.payments : [];
  const card = document.getElementById('paymentHistoryCard');

  if (!payments.length) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  const methodIcon = { cash: '💵', card: '💳', online: '🔗' };
  const methodLabel = { cash: 'Cash',       card: 'Card',       online: 'Online' };

  document.getElementById('paymentHistory').innerHTML = payments.map(p => {
    const m = p.payment_method;
    const ref = p.transaction_ref ? `· Ref ${escapeHtml(p.transaction_ref)}` : '';
    return `
      <div class="payment-row">
        <div class="pay-icon ${m}">${methodIcon[m] || '💰'}</div>
        <div class="pay-info">
          <div class="pay-method">${escapeHtml(methodLabel[m] || m)}</div>
          <div class="pay-meta">${fmtTime(p.created_at)} ${ref}</div>
        </div>
        <div class="pay-amount">+${fmtAed(p.amount)}</div>
      </div>
    `;
  }).join('');

  // Summary footer: total paid vs. balance remaining (if any).
  // Two-row layout when there's a balance, single row when fully paid.
  const summaryEl = document.getElementById('paymentSummary');
  if (balance > 0.005) {
    summaryEl.innerHTML = `
      <div style="display:flex;justify-content:space-between;width:100%">
        <span class="lbl">Total received</span>
        <span class="val" style="color:var(--success)">${fmtAed(paid)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;width:100%;margin-top:4px">
        <span class="lbl">Remaining due</span>
        <span class="val" style="color:var(--partial)">${fmtAed(balance)}</span>
      </div>
    `;
    summaryEl.style.flexDirection = 'column';
  } else {
    summaryEl.innerHTML = `
      <span class="lbl">Total received</span>
      <span class="val" style="color:var(--success)">${fmtAed(paid)}</span>
    `;
    summaryEl.style.flexDirection = 'row';
  }
}

loadOrder();  // single load — this is a receipt page, no polling needed
</script>

</body>
</html>
