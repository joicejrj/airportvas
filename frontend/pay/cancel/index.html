<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Cancelled — AirVAS</title>
<style>
body { background: #f0f6ff; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 16px; padding: 32px 24px; max-width: 400px;
  text-align: center; box-shadow: 0 12px 48px rgba(15,23,42,0.10); }
.icon { font-size: 56px; margin-bottom: 12px; }
h1 { font-size: 22px; color: #0f172a; margin-bottom: 8px; }
p { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 20px; }
.btn { display: inline-block; background: linear-gradient(135deg,#0ea5e9,#0284c7);
  color: #fff; padding: 12px 24px; border-radius: 10px; text-decoration: none;
  font-weight: 700; font-size: 15px; margin: 4px; }
.btn.outline { background: #fff; color: #0ea5e9; border: 1.5px solid #0ea5e9; }
.ref { font-size: 12px; color: #94a3b8; margin-top: 16px; font-family: monospace; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">⚠️</div>
  <h1>Payment Cancelled</h1>
  <p>Your booking has been saved but is unpaid. You can complete payment by retrying, or contact us if you need help.</p>
  <a href="/customer/" class="btn">Try Again</a>
  <a href="/pay/success?order=" id="trackLink" class="btn outline" style="display:none">View Order</a>
  <div class="ref" id="orderRef"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const order = params.get('order'), token = params.get('token');
if (order && token) {
  document.getElementById('trackLink').href = '/pay/success?order=' + order + '&token=' + token;
  document.getElementById('trackLink').style.display = 'inline-block';
  document.getElementById('orderRef').textContent = 'Order: AP-' + order.slice(0,6).toUpperCase();
}
</script>
</body>
</html>
