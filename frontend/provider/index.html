<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0ea5e9">
<link rel="manifest" href="/provider/manifest.json">
<link rel="apple-touch-icon" href="/icons/provider-192.png">
<meta name="apple-mobile-web-app-title" content="Provider">
<title>AirVAS — Provider</title>

<!-- Daterangepicker dependencies -->
<script src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

<style>
:root {
  --bg:#f0f6ff;--card:#fff;--accent:#0ea5e9;--accent2:#0284c7;
  --success:#16a34a;--danger:#dc2626;--warning:#d97706;
  --text1:#0f172a;--text2:#475569;--text3:#94a3b8;--border:#e2e8f0;
  --radius:14px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text1);font-family:var(--font);min-height:100dvh;max-width:480px;margin:0 auto}

.topbar{background:linear-gradient(135deg,#0ea5e9,#0284c7);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{color:#fff;font-size:18px;font-weight:800}
.topbar-name{color:rgba(255,255,255,.9);font-size:13px;font-weight:600;flex:1;text-align:right;margin:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}

.content{padding:16px 16px 100px}

/* JOB CARDS */
.job-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.job-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent)}
.job-card.assigned::before{background:#f59e0b}
.job-card.accepted::before{background:var(--accent)}
.job-card.in_progress::before{background:#8b5cf6}
.job-card.completed::before{background:var(--success)}

.job-plate{font-size:20px;font-weight:800;letter-spacing:1.5px;margin-bottom:4px}
.job-service{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent2)}
.job-customer{font-size:13px;color:var(--text2);margin-top:6px}
.job-location{font-size:13px;color:var(--text2);margin-top:8px;display:flex;align-items:flex-start;gap:6px}
.job-time{font-size:12px;color:var(--text3);margin-top:6px}

.job-photo{width:100%;border-radius:10px;margin-top:12px;max-height:180px;object-fit:cover;cursor:pointer;border:1px solid var(--border)}

.job-actions{display:flex;gap:10px;margin-top:14px}
.job-btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:opacity .15s;font-family:var(--font)}
.job-btn:active{opacity:.8}
.job-btn:disabled{opacity:.5;cursor:not-allowed}
.job-btn.accept{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff}
.job-btn.reject{background:#fee2e2;color:var(--danger)}
.job-btn.start{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff}
.job-btn.complete{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}

.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge.assigned{background:#fef3c7;color:#92400e}
.badge.accepted{background:#e0f2fe;color:#0284c7}
.badge.in_progress{background:#ede9fe;color:#7c3aed}
.badge.completed{background:#dcfce7;color:#166534}

.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}

/* STATS */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:800;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

/* SEGMENTED CONTROL */
.seg-control{display:flex;background:#fff;border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:14px;gap:4px}
.seg-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 8px;border:none;background:transparent;border-radius:8px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:var(--font);white-space:nowrap}
.seg-btn:active{transform:scale(0.97)}
.seg-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 8px rgba(14,165,233,0.3)}
.seg-btn .seg-icon{font-size:14px}
.seg-btn .seg-count{background:var(--danger);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;min-width:18px;text-align:center;line-height:1.4}
.seg-btn.active .seg-count{background:rgba(255,255,255,0.3)}

/* DATERANGE WRAPPER */
.daterange-wrap{display:flex;gap:8px;margin-bottom:14px;align-items:stretch}
.daterange-input{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text1);font-family:var(--font);outline:none;cursor:pointer;min-height:42px;display:flex;align-items:center;gap:8px}
.daterange-input:hover{border-color:var(--accent)}
.daterange-input .icon{color:var(--accent);font-size:14px}
.daterange-input .text{flex:1}
.daterange-clear-btn{padding:10px 14px;border:1.5px solid var(--border);background:#fff;color:var(--text2);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);min-height:42px;white-space:nowrap}
.daterange-clear-btn:active{background:var(--bg)}

/* daterangepicker overrides to fit theme */
.daterangepicker .ranges li.active{background-color:var(--accent)}
.daterangepicker td.active,.daterangepicker td.active:hover{background-color:var(--accent)}
.daterangepicker .drp-buttons .btn{font-family:var(--font)}
.daterangepicker .applyBtn{background-color:var(--accent);border-color:var(--accent)}
.daterangepicker .applyBtn:hover{background-color:var(--accent2);border-color:var(--accent2)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -4px 12px rgba(0,0,0,.06)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 6px;cursor:pointer;color:var(--text3);transition:color .15s;border:none;background:none;font-family:var(--font);position:relative}
.nav-btn.active{color:var(--accent)}
.nav-btn .nav-icon{font-size:22px}
.nav-btn .nav-label{font-size:10px;font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.nav-badge{background:var(--danger);color:#fff;font-size:9px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:absolute;top:4px;right:calc(50% - 22px)}

/* LOGIN */
#loginScreen{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#0ea5e9,#0284c7);z-index:9999;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .mark{font-size:26px;font-weight:800;color:var(--accent)}
.login-logo .sub{font-size:12px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:1.5px}
.login-input{width:100%;border:1.5px solid var(--border);background:#f8fafc;color:var(--text1);padding:13px 14px;border-radius:10px;font-size:15px;outline:none;margin-bottom:12px;font-family:var(--font)}
.login-input:focus{border-color:var(--accent);background:#fff}
.login-error{color:var(--danger);font-size:13px;min-height:20px;margin-bottom:8px;text-align:center}
.login-btn{width:100%;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.login-btn:disabled{opacity:.6;cursor:not-allowed}

/* PHOTO MODAL */
#photoModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9998;align-items:center;justify-content:center}
#photoModal.open{display:flex}
#photoModal img{max-width:95vw;max-height:90vh;border-radius:12px}
#photoModal .close{position:absolute;top:16px;right:16px;color:#fff;font-size:28px;cursor:pointer;background:rgba(0,0,0,.5);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;z-index:9999;display:none;max-width:90%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}

.load-more-footer {
  text-align: center;
  padding: 20px;
  color: var(--text3);
  font-size: 12px;
}
.load-more-spinner {
  display: inline-block;
  width: 24px;
  height: 24px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: lm-spin 0.8s linear infinite;
  margin-bottom: 8px;
}
@keyframes lm-spin { to { transform: rotate(360deg); } }
.load-end {
  text-align: center;
  padding: 20px;
  color: var(--text3);
  font-size: 12px;
  font-style: italic;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="mark">✈ AirVAS</div>
      <div class="sub">Provider Portal</div>
    </div>
    <input id="provEmail" class="login-input" type="email" placeholder="Email address" autocomplete="email"
      onkeydown="if(event.key==='Enter')document.getElementById('provPass').focus()">
    <input id="provPass" class="login-input" type="password" placeholder="Password" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <div id="provLoginError" class="login-error"></div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="appShell" style="display:none">

  <div class="topbar">
    <div class="topbar-logo">✈ AirVAS</div>
    <div class="topbar-name" id="provNameDisplay">Provider</div>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>

  <div class="content">

    <!-- ACTIVE JOBS TAB -->
    <div id="tab-active">
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-num" id="statActive">0</div>
          <div class="stat-lbl">Active Jobs</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statToday" style="color:var(--success)">0</div>
          <div class="stat-lbl">Completed Today</div>
        </div>
      </div>

      <!-- Segmented status filter with live counts -->
      <div class="seg-control" id="provSegFilter">
        <button class="seg-btn active" data-val="new" onclick="setProvFilter('new')">
          <span class="seg-icon">🔔</span>
          <span>New</span>
          <span class="seg-count" id="segCountNew" style="display:none">0</span>
        </button>
        <button class="seg-btn" data-val="active" onclick="setProvFilter('active')">
          <span class="seg-icon">⚡</span>
          <span>Active</span>
          <span class="seg-count" id="segCountActive" style="display:none">0</span>
        </button>
        <button class="seg-btn" data-val="completed" onclick="setProvFilter('completed')">
          <span class="seg-icon">✓</span>
          <span>Completed</span>
          <span class="seg-count" id="segCountCompleted" style="display:none">0</span>
        </button>
      </div>

      <div id="activeJobsList">
        <div class="empty"><div class="empty-icon">🎉</div><div>No jobs</div></div>
      </div>
    </div>

    <!-- HISTORY TAB -->
    <div id="tab-history" style="display:none">
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-num" id="histCount">0</div>
          <div class="stat-lbl">Jobs in Range</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="histToday" style="color:var(--success)">0</div>
          <div class="stat-lbl">Completed Today</div>
        </div>
      </div>

      <!-- Daterange picker -->
      <div class="daterange-wrap">
        <div class="daterange-input" id="historyDateRange">
          <span class="icon">📅</span>
          <span class="text" id="historyDateLabel">Last 30 days</span>
          <span style="color:var(--text3)">▼</span>
        </div>
        <button class="daterange-clear-btn" onclick="clearHistoryRange()">Reset</button>
      </div>

      <div id="historyList">
        <div class="empty"><div class="empty-icon">📋</div><div>Loading…</div></div>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-active" onclick="switchTab('active')">
      <span class="nav-icon">🔔</span>
      <span class="nav-label">Jobs</span>
      <span class="nav-badge" id="jobBadge" style="display:none">0</span>
    </button>
    <button class="nav-btn" id="nav-history" onclick="switchTab('history')">
      <span class="nav-icon">✅</span>
      <span class="nav-label">History</span>
    </button>
  </nav>
</div>

<!-- PHOTO MODAL -->
<div id="photoModal" onclick="closePhoto()">
  <button class="close" onclick="event.stopPropagation();closePhoto()">✕</button>
  <img id="photoModalImg" src="" alt="Vehicle photo">
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const API = location.origin + '/api';
let TOKEN = localStorage.getItem('ap_provider_token') || '';
let currentProvider = null;
let pollingTimer = null;
let currentTab = 'active';
let _provFilter = 'new';

// Pagination state — per filter so switching tabs doesn't lose place
const _pagination = {
  new:       { page: 1, hasMore: true, loading: false, items: [] },
  active:    { page: 1, hasMore: true, loading: false, items: [] },
  completed: { page: 1, hasMore: true, loading: false, items: [] },
  history:   { page: 1, hasMore: true, loading: false, items: [] },
};
const PAGE_SIZE = 20;

// Stale-load guard — increments on every fresh (non-append) load.
// If a fetch returns and _loadGen no longer matches, its results are discarded.
let _loadGen = 0;

// History date range
let _histFrom = null;
let _histTo   = null;

// Drop service workers not scoped to /provider/
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => {
      if (!r.scope.includes('/provider/')) r.unregister();
    });
  }).catch(() => {});

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/provider/sw.js', { scope: '/provider/' })
      .then(reg => console.log('[Provider SW] registered, scope:', reg.scope))
      .catch(err => console.warn('[Provider SW] registration failed:', err));
  });
}

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN };
}

async function apiFetch(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers || {}, authHeaders());
  try {
    const res = await fetch(API + path, opts);
    if (res.status === 401) { doLogout(); return null; }
    return await res.json().catch(() => ({}));
  } catch(e) {
    return null;
  }
}

// ── AUTH ──────────────────────────────────────────────────────
async function checkAuth() {
  if (!TOKEN) { showLoginScreen(); return; }
  const res = await apiFetch('/auth/me');
  if (!res?.data) { showLoginScreen(); return; }

  if (res.data.role !== 'provider' && res.data.role !== 'admin') {
    localStorage.removeItem('ap_provider_token'); TOKEN = '';
    showLoginScreen();
    document.getElementById('provLoginError').textContent =
      'This account is a ' + res.data.role + '. Use the ' + res.data.role + ' portal.';
    return;
  }

  currentProvider = res.data;
  document.getElementById('provNameDisplay').textContent = currentProvider.name;
  showApp();
  startPolling();
}

function showLoginScreen() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
  initDateRangePicker();
  loadJobs();
}

async function doLogin() {
  const email = document.getElementById('provEmail').value.trim();
  const pass  = document.getElementById('provPass').value;
  const err   = document.getElementById('provLoginError');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Enter email and password'; return; }

  const btn = document.querySelector('.login-btn');
  btn.textContent = 'Signing in…'; btn.disabled = true;

  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const json = await res.json();
    if (json.token) {
      if (json.user && json.user.role !== 'provider' && json.user.role !== 'admin') {
        err.textContent = 'This account is a ' + json.user.role + '. Use the ' + json.user.role + ' portal.';
        btn.textContent = 'Sign In'; btn.disabled = false; return;
      }
      TOKEN = json.token;
      localStorage.setItem('ap_provider_token', TOKEN);
      currentProvider = json.user;
      document.getElementById('provNameDisplay').textContent = currentProvider.name;
      showApp();
      startPolling();
    } else {
      err.textContent = json.error || json.message || 'Invalid credentials';
      btn.textContent = 'Sign In'; btn.disabled = false;
    }
  } catch(e) {
    err.textContent = 'Connection error';
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
}

function doLogout() {
  clearInterval(pollingTimer);
  if (TOKEN) {
    fetch(API + '/auth/logout', { method: 'POST', headers: authHeaders() }).catch(()=>{});
  }
  localStorage.removeItem('ap_provider_token');
  TOKEN = '';
  location.reload();
}

// ── SEGMENT FILTER ─────────────────────────────────────────────
function setProvFilter(val) {
  _provFilter = val;
  document.querySelectorAll('#provSegFilter .seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.val === val);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  loadJobs();
}

// ── JOBS (Jobs tab) ────────────────────────────────────────────
async function loadJobs(append = false) {
  refreshSegmentCounts();

  const seg = _pagination[_provFilter];
  const myGen = append ? _loadGen : ++_loadGen;

  if (!append) {
    seg.page = 1;
    seg.hasMore = true;
    seg.items = [];
  }
  if (seg.loading || !seg.hasMore) return;
  seg.loading = true;

  let statusParam = '';
  if (_provFilter === 'new')       statusParam = 'assigned';
  if (_provFilter === 'active')    statusParam = 'accepted,in_progress';
  if (_provFilter === 'completed') statusParam = 'completed';

  const qs = new URLSearchParams({ status: statusParam, limit: PAGE_SIZE, page: seg.page });

  if (_provFilter === 'completed') {
    const today = new Date();
    const weekAgo = new Date();
    weekAgo.setDate(today.getDate() - 6);
    qs.set('from', weekAgo.toISOString().slice(0, 10));
    qs.set('to',   today.toISOString().slice(0, 10));
  }

  const el = document.getElementById('activeJobsList');

  if (!append) {
    el.innerHTML = '<div class="load-more-footer"><div class="load-more-spinner"></div><div>Loading…</div></div>';
  } else {
    const ind = document.createElement('div');
    ind.className = 'load-more-footer';
    ind.id = '_loadMoreInd';
    ind.innerHTML = '<div class="load-more-spinner"></div><div>Loading more…</div>';
    el.appendChild(ind);
  }

  try {
    const res = await apiFetch('/provider/jobs?' + qs.toString());

    // Discard stale loads — user already switched segment
    if (myGen !== _loadGen) {
      seg.loading = false;
      document.getElementById('_loadMoreInd')?.remove();
      return;
    }

    const newItems = res?.data || [];
    seg.items = append ? [...seg.items, ...newItems] : newItems;
    seg.hasMore = newItems.length === PAGE_SIZE;
    if (seg.hasMore) seg.page += 1;
  } finally {
    seg.loading = false;
    document.getElementById('_loadMoreInd')?.remove();
  }

  renderJobsList(seg);
  ensureViewportFilled();
}

function renderJobsList(seg) {
  const el = document.getElementById('activeJobsList');
  if (!seg.items.length) {
    const msg = {
      new:       { icon: '🎉', title: 'No new jobs', sub: 'You\'re all caught up!' },
      active:    { icon: '☕', title: 'Nothing in progress', sub: 'Accept a job to get started' },
      completed: { icon: '📋', title: 'No completed jobs', sub: 'Check the History tab for older work' },
    }[_provFilter];
    el.innerHTML = `<div class="empty"><div class="empty-icon">${msg.icon}</div><div>${msg.title}</div><div style="font-size:13px;margin-top:6px">${msg.sub}</div></div>`;
    return;
  }
  el.innerHTML =
    seg.items.map(j => renderJobCard(j)).join('') +
    (seg.hasMore
      ? '<div class="load-more-footer" id="_loadMoreSentinel">Scroll down to load more</div>'
      : (seg.items.length > PAGE_SIZE
          ? '<div class="load-end">— end of list —</div>'
          : ''));
}

// Fetches counts for all three segments and updates UI badges
async function refreshSegmentCounts() {
  try {
    const today = new Date().toISOString().slice(0,10);

    const [newRes, activeRes, completedRes] = await Promise.all([
      apiFetch('/provider/jobs?status=assigned&limit=100'),
      apiFetch('/provider/jobs?status=accepted,in_progress&limit=100'),
      apiFetch(`/provider/jobs?status=completed&from=${today}&to=${today}&limit=100`),
    ]);

    const newCount  = (newRes?.data || []).length;
    const actCount  = (activeRes?.data || []).length;
    const compCount = (completedRes?.data || []).length;

    setSegCount('segCountNew', newCount);
    setSegCount('segCountActive', actCount);
    setSegCount('segCountCompleted', compCount);

    document.getElementById('statActive').textContent = newCount + actCount;
    document.getElementById('statToday').textContent  = compCount;

    const navBadge = document.getElementById('jobBadge');
    if (newCount > 0) {
      navBadge.style.display = 'flex';
      navBadge.textContent = newCount > 99 ? '99+' : newCount;
    } else {
      navBadge.style.display = 'none';
    }
  } catch (e) { /* swallow */ }
}

function setSegCount(id, n) {
  const el = document.getElementById(id);
  if (!el) return;
  if (n > 0) {
    el.style.display = 'inline-block';
    el.textContent = n > 99 ? '99+' : n;
  } else {
    el.style.display = 'none';
  }
}

// ── HISTORY (History tab) ─────────────────────────────────────
function initDateRangePicker() {
  if (typeof $ === 'undefined' || typeof $.fn.daterangepicker === 'undefined') {
    setTimeout(initDateRangePicker, 200);
    return;
  }

  const start = moment().subtract(29, 'days').startOf('day');
  const end   = moment().endOf('day');

  $('#historyDateRange').daterangepicker({
    startDate: start,
    endDate:   end,
    maxDate:   moment().endOf('day'),
    opens:     'center',
    autoApply: true,
    locale: {
      format: 'D MMM YYYY',
      cancelLabel: 'Cancel',
    },
    ranges: {
      'Today':         [moment(), moment()],
      'Yesterday':     [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
      'Last 7 Days':   [moment().subtract(6, 'days'), moment()],
      'Last 30 Days':  [moment().subtract(29, 'days'), moment()],
      'This Month':    [moment().startOf('month'), moment().endOf('month')],
      'Last Month':    [moment().subtract(1, 'month').startOf('month'),
                        moment().subtract(1, 'month').endOf('month')],
    },
  }, function(picked_start, picked_end, label) {
    _histFrom = picked_start.format('YYYY-MM-DD');
    _histTo   = picked_end.format('YYYY-MM-DD');
    updateHistoryDateLabel(picked_start, picked_end, label);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (currentTab === 'history') loadHistory();
  });

  _histFrom = start.format('YYYY-MM-DD');
  _histTo   = end.format('YYYY-MM-DD');
  updateHistoryDateLabel(start, end, 'Last 30 Days');
}

function updateHistoryDateLabel(start, end, label) {
  const el = document.getElementById('historyDateLabel');
  if (!el) return;
  if (label && label !== 'Custom Range') {
    el.textContent = label;
  } else {
    el.textContent = start.format('D MMM') + ' – ' + end.format('D MMM YYYY');
  }
}

function clearHistoryRange() {
  if (typeof $ === 'undefined' || typeof $.fn.daterangepicker === 'undefined') return;
  const start = moment().subtract(29, 'days').startOf('day');
  const end   = moment().endOf('day');
  const dp = $('#historyDateRange').data('daterangepicker');
  if (dp) {
    dp.setStartDate(start);
    dp.setEndDate(end);
  }
  _histFrom = start.format('YYYY-MM-DD');
  _histTo   = end.format('YYYY-MM-DD');
  updateHistoryDateLabel(start, end, 'Last 30 Days');
  loadHistory();
}

async function loadHistory(append = false) {
  const seg = _pagination.history;
  const myGen = append ? _loadGen : ++_loadGen;

  if (!append) {
    seg.page = 1;
    seg.hasMore = true;
    seg.items = [];
  }
  if (seg.loading || !seg.hasMore) return;
  seg.loading = true;

  const qs = new URLSearchParams({ status: 'completed', limit: PAGE_SIZE, page: seg.page });
  if (_histFrom) qs.set('from', _histFrom);
  if (_histTo)   qs.set('to',   _histTo);

  const el = document.getElementById('historyList');
  if (!append) {
    el.innerHTML = '<div class="load-more-footer"><div class="load-more-spinner"></div><div>Loading…</div></div>';
  } else {
    const ind = document.createElement('div');
    ind.className = 'load-more-footer';
    ind.id = '_loadMoreIndHist';
    ind.innerHTML = '<div class="load-more-spinner"></div><div>Loading more…</div>';
    el.appendChild(ind);
  }

  try {
    const res = await apiFetch('/provider/jobs?' + qs.toString());

    // Discard stale loads
    if (myGen !== _loadGen) {
      seg.loading = false;
      document.getElementById('_loadMoreIndHist')?.remove();
      return;
    }

    const newItems = res?.data || [];
    seg.items = append ? [...seg.items, ...newItems] : newItems;
    seg.hasMore = newItems.length === PAGE_SIZE;
    if (seg.hasMore) seg.page += 1;

    if (!append) {
      document.getElementById('histCount').textContent = newItems.length;
      const today = new Date().toDateString();
      const todayCount = newItems.filter(j =>
        j.completed_at && new Date(j.completed_at + (/Z|[+-]\d{2}/.test(j.completed_at) ? '' : 'Z')).toDateString() === today
      ).length;
      document.getElementById('histToday').textContent = todayCount;
    } else {
      const cEl = document.getElementById('histCount');
      if (cEl) cEl.textContent = seg.items.length;
    }
  } finally {
    seg.loading = false;
    document.getElementById('_loadMoreIndHist')?.remove();
  }

  renderHistoryList(seg);
  ensureViewportFilled();
}

function renderHistoryList(seg) {
  const el = document.getElementById('historyList');
  if (!seg.items.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div>No completed jobs in this range</div><div style="font-size:13px;margin-top:6px">Try a wider date range</div></div>';
    return;
  }
  el.innerHTML =
    seg.items.map(j => renderJobCard(j)).join('') +
    (seg.hasMore
      ? '<div class="load-more-footer" id="_loadMoreSentinelHist">Scroll down to load more</div>'
      : (seg.items.length > PAGE_SIZE
          ? '<div class="load-end">— end of list —</div>'
          : ''));
}

// If the loaded list is shorter than the viewport (nothing to scroll),
// trigger another page load automatically.
function ensureViewportFilled() {
  requestAnimationFrame(() => {
    const docHeight = document.documentElement.scrollHeight;
    const viewHeight = window.innerHeight;
    if (docHeight <= viewHeight + 50) {
      if (currentTab === 'active') {
        const seg = _pagination[_provFilter];
        if (seg && seg.hasMore && !seg.loading) loadJobs(true);
      } else if (currentTab === 'history') {
        const seg = _pagination.history;
        if (seg.hasMore && !seg.loading) loadHistory(true);
      }
    }
  });
}

// ── RENDER JOB CARD ───────────────────────────────────────────
function isPorter(j) {
  const svc = (j.service_name || '').toLowerCase();
  return svc.includes('porter') || (j.vehicle_plate || '').toUpperCase() === 'PORTER';
}

function renderJobCard(j) {
  const statusLabels = {
    assigned: 'New Job', accepted: 'Accepted',
    in_progress: 'In Progress', completed: 'Completed'
  };
  const porter = isPorter(j);
  const serviceLabel = porter ? '🧳 Porter' : '🚗 ' + (j.service_name || 'Service');

  const src = resolveImageSrc(j.image_path);
  const imgHtml = src
    ? `<img src="${escapeAttr(src)}" class="job-photo" onclick="openPhoto(this.src)" alt="Vehicle photo" onerror="this.style.display='none'">`
    : '';

  const startLabel = porter ? '▶ Start Porter' : '▶ Start Service';

  let actions = '';
  if (j.status === 'assigned') {
    actions = `
      <div class="job-actions">
        <button class="job-btn accept" onclick="jobAction('${j.id}','accept', this)">✓ Accept</button>
        <button class="job-btn reject" onclick="jobAction('${j.id}','reject', this)">✕ Reject</button>
      </div>`;
  } else if (j.status === 'accepted') {
    actions = `<div class="job-actions"><button class="job-btn start" onclick="jobAction('${j.id}','start', this)">${startLabel}</button></div>`;
  } else if (j.status === 'in_progress') {
    actions = `
      <div style="background:#ede9fe;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px;color:#7c3aed;font-weight:600">
        ⏱ In progress · <span class="elapsed-counter" data-started-at="${escapeAttr(j.started_at || '')}">${fmtElapsed(j.started_at)}</span>
      </div>
      <div class="job-actions" style="margin-top:10px">
        <button class="job-btn complete" onclick="jobAction('${j.id}','complete', this)">✓ Mark Complete</button>
      </div>`;
  } else if (j.status === 'completed') {
    actions = `<div style="color:var(--success);font-size:13px;font-weight:600;margin-top:10px">✓ Completed ${fmtTime(j.completed_at)}</div>`;
  }

  let customerLine = '';
  if (j.customer_name || j.customer_phone) {
    customerLine = `<div class="job-customer">👤 ${escapeHtml(j.customer_name || '—')}${j.customer_phone ? ' · ' + escapeHtml(j.customer_phone) : ''}</div>`;
  }

  return `
    <div class="job-card ${j.status}" id="job-${j.id}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div>
          <div class="job-plate">${escapeHtml(j.vehicle_plate || '—')}</div>
          <div class="job-service">${serviceLabel}</div>
        </div>
        <span class="badge ${j.status}">${statusLabels[j.status] || j.status}</span>
      </div>
      ${customerLine}
      ${(j.location_details && j.location_details.trim().toLowerCase() !== 'see photo')
	  ? `<div class="job-location">📍 <span>${escapeHtml(j.location_details.trim())}</span></div>`
	  : ''}
      ${(j.order_notes && j.order_notes.trim().toLowerCase() !== 'see photo')
	  ? `<div class="job-location" style="margin-top:4px">📝 <span>${escapeHtml(j.order_notes.trim())}</span></div>`
	  : ''}
      ${imgHtml}
      <div class="job-time">🕐 Assigned ${fmtTime(j.assigned_at || j.created_at)}</div>
      ${actions}
    </div>`;
}

async function jobAction(svcId, action, btn) {
  const card = document.getElementById('job-' + svcId);
  const allBtns = card ? card.querySelectorAll('.job-btn') : [];
  const originalLabels = [];
  allBtns.forEach((b, i) => {
    originalLabels[i] = b.textContent;
    b.disabled = true;
  });
  if (btn) btn.textContent = '…';

  if (action === 'reject' && !confirm('Reject this job? It will be reassigned to another provider.')) {
    allBtns.forEach((b, i) => { b.disabled = false; b.textContent = originalLabels[i]; });
    return;
  }

  const res = await apiFetch(`/provider/jobs/${svcId}/${action}`, {
    method: 'PATCH',
    body: JSON.stringify({})
  });

  if (res?.success) {
    const msg = action === 'accept' ? '✓ Job accepted'
              : action === 'reject' ? 'Job rejected'
              : action === 'start'  ? '▶ Started'
              : '✅ Completed';
    showToast(msg);
    await loadJobs();
    if (action === 'complete' && currentTab === 'history') loadHistory();
  } else {
    showToast(res?.error || res?.message || 'Action failed');
    allBtns.forEach((b, i) => { b.disabled = false; b.textContent = originalLabels[i]; });
  }
}

// ── TABS ──────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + tab).classList.add('active');
  document.getElementById('tab-active').style.display  = tab === 'active'  ? 'block' : 'none';
  document.getElementById('tab-history').style.display = tab === 'history' ? 'block' : 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (tab === 'active')  loadJobs();
  if (tab === 'history') loadHistory();
}

// ── POLLING ───────────────────────────────────────────────────
function startPolling() {
  if (pollingTimer) clearInterval(pollingTimer);
  pollingTimer = setInterval(() => {
    if (currentTab === 'active') {
      // Only auto-refresh if user is at the top (not scrolled into older pages)
      if (window.scrollY < 200) {
        loadJobs();
      } else {
        refreshSegmentCounts();
      }
    } else {
      refreshSegmentCounts();
    }
  }, 20000);
}

// ── PHOTO MODAL ───────────────────────────────────────────────
function openPhoto(src) {
  document.getElementById('photoModalImg').src = src;
  document.getElementById('photoModal').classList.add('open');
}
function closePhoto() {
  document.getElementById('photoModal').classList.remove('open');
}

// ── UTILS ─────────────────────────────────────────────────────
function fmtTime(dt) {
  if (!dt) return '—';
  const isoSafe = /Z|[+-]\d{2}:?\d{2}$/.test(dt) ? dt : dt.replace(' ', 'T') + 'Z';
  const d = new Date(isoSafe), now = new Date();
  if (isNaN(d.getTime())) return '—';
  const diff = (now - d) / 1000;
  if (diff < 60)    return 'Just now';
  if (diff < 3600)  return Math.round(diff/60) + 'm ago';
  if (diff < 86400) return Math.round(diff/3600) + 'h ago';
  return d.toLocaleDateString('en-AE',{day:'numeric',month:'short'});
}

function fmtElapsed(startedAt) {
  if (!startedAt) return '0 min';
  const isoSafe = /Z|[+-]\d{2}:?\d{2}$/.test(startedAt) ? startedAt : startedAt.replace(' ', 'T') + 'Z';
  const start = new Date(isoSafe);
  if (isNaN(start.getTime())) return '0 min';
  const diffSec = Math.max(0, (Date.now() - start.getTime()) / 1000);
  if (diffSec < 60) return Math.floor(diffSec) + ' sec elapsed';
  const minutes = Math.floor(diffSec / 60);
  if (minutes < 60) return minutes + ' min elapsed';
  const hours = Math.floor(minutes / 60);
  const mins  = minutes % 60;
  return `${hours}h ${mins}m elapsed`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return String(s ?? '').replace(/"/g, '&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function resolveImageSrc(imagePath) {
  if (!imagePath) return null;
  const v = String(imagePath).trim();
  if (v.startsWith('data:image/')) return v;
  if (v.startsWith('/uploads/') || v.startsWith('http://') || v.startsWith('https://')) return v;
  return null;
}

// ── Live elapsed counter — tick every second ─────────────────
setInterval(() => {
  document.querySelectorAll('.elapsed-counter').forEach(el => {
    const startedAt = el.dataset.startedAt;
    if (startedAt) el.textContent = fmtElapsed(startedAt);
  });
}, 1000);

// ── Infinite scroll ──────────────────────────────────────────
function attachScrollLoader() {
  let scrollPending = false;
  window.addEventListener('scroll', () => {
    if (scrollPending) return;
    scrollPending = true;
    requestAnimationFrame(() => {
      scrollPending = false;
      checkLoadMore();
    });
  }, { passive: true });
}

function checkLoadMore() {
  const docHeight = document.documentElement.scrollHeight;
  const scrollPos = window.scrollY + window.innerHeight;
  if (docHeight - scrollPos > 300) return;

  if (currentTab === 'active') {
    const seg = _pagination[_provFilter];
    if (seg && seg.hasMore && !seg.loading) loadJobs(true);
  } else if (currentTab === 'history') {
    const seg = _pagination.history;
    if (seg.hasMore && !seg.loading) loadHistory(true);
  }
}

attachScrollLoader();

// ── BOOT ─────────────────────────────────────────────────────
checkAuth();
</script>
