<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/team-leader/manifest.json">
<link rel="apple-touch-icon" href="/iconspwa/tl-192.png">
<title>Airport VAS · Team Leader</title>

<!-- Typefaces: Inter for UI, JetBrains Mono for numerals & codes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">

<style>
:root {
  /* Palette — blue/white (matches admin panel) */
  --bg:        #f8fafc;       /* slate-50 */
  --bg-elev:   #ffffff;
  --bg-soft:   #f1f5f9;       /* slate-100 */
  --line:      #e2e8f0;       /* slate-200 */
  --line-strong: #cbd5e1;     /* slate-300 */

  --ink:       #0f172a;       /* slate-900 */
  --ink-soft:  #334155;       /* slate-700 */
  --ink-mute:  #94a3b8;       /* slate-400 */
  --ink-faint: #cbd5e1;       /* slate-300 */

  --accent:        #0ea5e9;   /* sky-500 */
  --accent-soft:   #0284c7;   /* sky-600 — hover / pressed */
  --accent-pale:   rgba(14, 165, 233, 0.10);

  --gold:      #d97706;       /* amber-600 — pending / "in progress" */
  --gold-soft: rgba(217, 119, 6, 0.12);

  --good:      #16a34a;       /* green-600 */
  --good-pale: rgba(22, 163, 74, 0.12);
  --bad:       #dc2626;       /* red-600 */
  --bad-pale:  rgba(220, 38, 38, 0.12);
  --warn:      #d97706;       /* amber-600 */
  --warn-pale: rgba(217, 119, 6, 0.12);

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.10);
  --shadow-lg: 0 24px 48px -16px rgba(15, 23, 42, 0.20);

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;

  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:    'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;

  --nav-h: 68px;
  --top-h: 56px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
body { min-height: 100dvh; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; }

.tabular { font-variant-numeric: tabular-nums; }

/* ─── LOGIN SCREEN ────────────────────────────────────────────────── */
#login-screen {
  display: none;
  position: fixed; inset: 0;
  background:
    radial-gradient(140% 100% at 50% 0%, var(--accent-pale) 0%, transparent 55%),
    var(--bg);
  z-index: 100;
  padding: 24px;
  overflow-y: auto;
}
#login-screen.active { display: block; }
.login-wrap {
  max-width: 380px;
  margin: 12vh auto 0;
  text-align: center;
}
.login-brand {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 36px;
  letter-spacing: -0.02em;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 4px;
}
.login-brand .dot { display: none; }
.login-tag {
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 600;
  margin-bottom: 40px;
}
.login-card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 28px 24px 24px;
  box-shadow: var(--shadow-md);
  text-align: left;
}
.login-h {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: -0.01em;
  margin: 0 0 24px;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  color: var(--ink-mute);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 14px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px; /* prevents iOS zoom */
  transition: border-color .2s, background .2s;
}
.field input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-elev);
}
.btn-primary {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: var(--r-md);
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.02em;
  transition: transform .1s, background .2s;
  margin-top: 8px;
}
.btn-primary:active { transform: scale(.98); background: var(--accent-soft); }
.btn-primary:disabled { opacity: .55; }
.login-err {
  color: var(--bad);
  font-size: 13px;
  margin-top: 12px;
  min-height: 18px;
  text-align: center;
}

/* ─── APP SHELL ───────────────────────────────────────────────────── */
#app-shell {
  display: none;
  min-height: 100dvh;
  padding-top: var(--top-h);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
#app-shell.active { display: block; }

.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--top-h);
  background: var(--bg-elev);
  border-bottom: 1px solid var(--line);
  padding: 0 18px;
  display: flex; align-items: center;
  z-index: 50;
  padding-top: env(safe-area-inset-top);
  height: calc(var(--top-h) + env(safe-area-inset-top));
}
.topbar-brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  color: var(--accent);
  letter-spacing: -0.01em;
  flex: 1;
}
.topbar-brand .dot { display: none; }
.service-chip {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--accent-pale);
  color: var(--accent);
}
.net-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--good);
  margin-left: 10px;
  transition: background .3s;
}
.net-dot.offline { background: var(--bad); }

/* ─── OFFLINE BANNER ─────────────────────────────────────────────── */
#offline-banner {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: var(--bad);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  padding: 6px 14px;
  z-index: 80;
  transform: translateY(-100%);
  transition: transform .25s ease-out;
  padding-top: calc(6px + env(safe-area-inset-top));
}
#offline-banner.show { transform: translateY(0); }
#offline-banner.show ~ #app-shell .topbar { margin-top: 28px; transition: margin-top .25s; }

#app-shell main {
  padding: 14px 14px 0;
  max-width: 720px;
  margin: 0 auto;
}

/* ─── TAB CONTENT ─────────────────────────────────────────────────── */
.tab-pane { display: none; }
.tab-pane.active { display: block; }

.tab-h {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.02em;
  margin: 4px 4px 12px;
  line-height: 1.15;
}
/* Eyebrow line — only used by the New Order tab where the service name
 * is genuinely informational. Other tabs drop the eyebrow entirely. */
.tab-h small {
  display: block;
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-mute);
}
.empty-state-glyph {
  font-family: var(--font-display);
  font-size: 56px;
  font-weight: 500;
  color: var(--ink-faint);
  letter-spacing: -0.04em;
  margin-bottom: 8px;
  line-height: 1;
}
.empty-state-msg {
  font-size: 14px;
  font-weight: 500;
}

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 0;
  color: var(--ink-mute);
}
.spinner {
  width: 22px; height: 22px;
  border: 2.5px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── BOTTOM NAV ──────────────────────────────────────────────────── */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-elev);
  border-top: 1px solid var(--line);
  display: flex;
  z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1;
  background: none;
  border: none;
  padding: 10px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--ink-mute);
  transition: color .15s;
  position: relative;
}
.nav-btn.active { color: var(--accent); }
.nav-btn.active::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 28px; height: 3px;
  background: var(--accent);
  border-radius: 0 0 3px 3px;
}
.nav-btn .nav-icon {
  font-size: 17px;
  line-height: 1;
}
.nav-btn .nav-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.nav-btn .nav-badge {
  position: absolute;
  top: 4px; right: 22%;
  min-width: 16px; height: 16px;
  padding: 0 4px;
  background: var(--gold);
  color: #fff;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
/* The [hidden] attribute on a flex/grid element is otherwise
 * overridden by display: flex above. Force it to truly hide so
 * `el.hidden = true` in JS actually disappears the badge. */
.nav-btn .nav-badge[hidden] { display: none; }

/* ─── TOAST ───────────────────────────────────────────────────────── */
#toast-host {
  position: fixed;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  left: 16px; right: 16px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: var(--bg);
  padding: 12px 16px;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-md);
  animation: toast-in .25s ease-out;
  max-width: 480px;
  margin: 0 auto;
}
.toast.success { background: var(--good); }
.toast.error   { background: var(--bad); }
@keyframes toast-in {
  from { transform: translateY(20px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

/* ─── COMMON CARD STYLES (shared by tabs) ─────────────────────────── */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.serial-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 18px;
  line-height: 1;
  color: var(--accent);
  padding: 5px 10px;
  background: var(--accent-pale);
  border-radius: 6px;
  letter-spacing: -0.01em;
}
.row-between {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.muted   { color: var(--ink-mute); font-size: 12px; }
.label   { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-mute); font-weight: 700; }

.tag {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.tag.pending     { background: var(--warn-pale); color: var(--warn); }
.tag.accepted    { background: var(--accent-pale); color: var(--accent); }
.tag.in_progress { background: var(--gold-soft); color: var(--gold); }
.tag.completed   { background: var(--good-pale); color: var(--good); }
.tag.cancelled   { background: var(--bad-pale); color: var(--bad); }
.tag.disputed    { background: var(--bad-pale); color: var(--bad); }
.tag.confirmed   { background: var(--good-pale); color: var(--good); }

/* ─── DESKTOP / TABLET LANDSCAPE (≥ 900px) ────────────────────────
 * Convert the mobile-first layout to a desktop one:
 *   - Bottom nav becomes a fixed left sidebar (220 px wide)
 *   - Top bar shifts right so the brand area is hidden by the sidebar
 *   - Main content area gets a left offset = sidebar width, no bottom padding
 *   - max-width grows from 720 → 1100 so wide screens can breathe
 */
@media (min-width: 900px) {
  :root { --side-w: 220px; }

  /* Topbar — make room for the sidebar. Keep the white background of
   * the base .topbar rule (same as the sidebar), so the top strip
   * reads as one unified header bar from left edge to right edge.
   * The brand text in the topbar is hidden because the sidebar's
   * ::before pseudo-element already shows it. */
  .topbar {
    left: var(--side-w);
    padding-left: 24px;
    padding-right: 24px;
  }
  .topbar-brand { display: none; } /* sidebar shows the brand instead */

  /* Without the topbar-brand (which had flex: 1 to fill the space
   * and push these elements right), the chip + net-dot would sit
   * on the LEFT of the topbar. Push them back to the right edge
   * with margin-left: auto on the chip. */
  .topbar .service-chip { margin-left: auto; }

  #app-shell {
    padding-bottom: 0;
    padding-left: var(--side-w);
  }
  #app-shell main {
    /* Bumped from 1100 → 1400 so My Jobs cards aren't squeezed into a
     * narrow centered column on widescreen monitors. Still capped so
     * we don't get a giant ribbon on ultrawide displays. */
    max-width: 1400px;
    padding: 22px 28px 32px;
  }

  /* Bottom nav → left sidebar */
  .bottomnav {
    top: 0; bottom: 0;
    right: auto;
    width: var(--side-w);
    flex-direction: column;
    align-items: stretch;
    padding-top: calc(var(--top-h) + env(safe-area-inset-top) + 12px);
    padding-bottom: 12px;
    border-top: none;
    border-right: 1px solid var(--line);
    background: var(--bg-elev);
    z-index: 60;
  }
  .nav-btn {
    flex: 0 0 auto;
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
    padding: 12px 18px;
    margin: 2px 10px;
    border-radius: var(--r-md);
    text-align: left;
  }
  .nav-btn.active {
    background: var(--accent-pale);
    color: var(--accent);
  }
  .nav-btn.active::before {
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    width: 3px; height: 22px;
    border-radius: 0 3px 3px 0;
  }
  .nav-btn .nav-icon  { font-size: 18px; }
  .nav-btn .nav-label { font-size: 13px; letter-spacing: 0; font-weight: 600; }
  .nav-btn .nav-badge {
    position: static;
    margin-left: auto;
  }

  /* Sidebar brand at the top.
   *
   * The negative vertical top-margin pulls the brand up into the
   * space the sidebar's padding-top reserved, so the brand sits
   * flush with the top of the viewport (same y as the topbar).
   *
   * Horizontal margin is 0 here. The brand fills the sidebar
   * exactly — without this it used to extend 10px past the right
   * edge of the sidebar and bleed into the topbar area. */
  .bottomnav::before {
    content: '✈ AirVAS';
    display: block;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    color: var(--accent);
    letter-spacing: -0.01em;
    padding: 18px 24px 18px;
    border-bottom: 1px solid var(--line);
    margin: calc(-1 * (var(--top-h) + env(safe-area-inset-top) + 12px)) 0 10px;
    padding-top: calc(env(safe-area-inset-top) + 18px);
    background: var(--bg-elev);
  }

  #offline-banner.show ~ #app-shell .topbar { margin-top: 0; }
  #offline-banner { padding-left: calc(var(--side-w) + 14px); }

  /* Login screen stays centered — no sidebar there */
  #login-screen { padding: 40px; }
  .login-wrap { margin-top: 8vh; }
}
@media (min-width: 1400px) {
  #app-shell main { padding-left: 40px; padding-right: 40px; }
}

</style>
</head>

<body>

<!-- ─── LOGIN SCREEN ───────────────────────────────────────────── -->
<div id="login-screen" class="active">
  <div class="login-wrap">
    <div class="login-brand">✈ AirVAS</div>
    <div class="login-tag">Team Leader · UAE Airports</div>

    <div class="login-card">
      <h1 class="login-h">Sign in</h1>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="li-email">Email</label>
          <input id="li-email" type="email" inputmode="email" autocomplete="username"
                 placeholder="tl.wash@airportvas.ae" required>
        </div>
        <div class="field">
          <label for="li-password">Password</label>
          <input id="li-password" type="password" autocomplete="current-password"
                 placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="li-submit">Sign in</button>
        <div class="login-err" id="li-err"></div>
      </form>
    </div>
  </div>
</div>

<!-- ─── APP SHELL ──────────────────────────────────────────────── -->
<div id="app-shell">

  <header class="topbar">
    <div class="topbar-brand">✈ AirVAS</div>
    <div class="service-chip" id="service-chip">—</div>
    <div class="net-dot" id="net-dot" title="Online"></div>
  </header>

  <main>
    <!-- Each tab is rendered by its own JS module -->
    <section id="tab-available"  class="tab-pane active"></section>
    <section id="tab-jobs"       class="tab-pane"></section>
    <section id="tab-new-order"  class="tab-pane"></section>
    <section id="tab-handover"   class="tab-pane"></section>
    <section id="tab-profile"    class="tab-pane"></section>
  </main>

  <nav class="bottomnav" role="tablist">
    <button class="nav-btn active" data-tab="available" role="tab">
      <span class="nav-icon">◉</span><span class="nav-label">New Jobs</span>
      <span class="nav-badge" id="badge-available" hidden></span>
    </button>
    <button class="nav-btn" data-tab="jobs" role="tab">
      <span class="nav-icon">◈</span><span class="nav-label">My Jobs</span>
      <span class="nav-badge" id="badge-jobs" hidden></span>
    </button>
    <button class="nav-btn" data-tab="new-order" role="tab">
      <span class="nav-icon">＋</span><span class="nav-label">New Order</span>
    </button>
    <button class="nav-btn" data-tab="handover" role="tab">
      <span class="nav-icon">⇄</span><span class="nav-label">Payment handover</span>
    </button>
    <button class="nav-btn" data-tab="profile" role="tab">
      <span class="nav-icon">◐</span><span class="nav-label">Profile</span>
    </button>
  </nav>
</div>

<div id="toast-host"></div>

<!-- ─── App scripts (ES modules) ────────────────────────────────── -->
<script type="module" src="/team-leader/app.js"></script>

</body>
</html>
