<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0ea5e9">
<title>Airport VAS · Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
:root {
  --bg:       #f8fafc;
  --surface:  #ffffff;
  --card:     #ffffff;
  --border:   #e2e8f0;
  --border2:  #cbd5e1;
  --accent:   #0ea5e9;
  --accent2:  #0284c7;
  --accent-soft: rgba(14,165,233,0.10);
  --gold:     #d97706;       /* used for "pending" / handover badge — warning amber */
  --gold-soft:rgba(217,119,6,0.12);
  --danger:   #dc2626;
  --danger-soft: rgba(220,38,38,0.12);
  --success:  #16a34a;
  --success-soft: rgba(22,163,74,0.12);
  --warning:  #d97706;
  --warning-soft: rgba(217,119,6,0.12);
  --ink:      #0f172a;
  --muted:    #94a3b8;
  --muted2:   #475569;
  --hover-bg: #f1f5f9;
  --soft-bg:  #f1f5f9;
  --font-head:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 13px;
  min-height: 100vh; display: flex;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; }

.tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ─── SIDEBAR ────────────────────────────────────────────────── */
.sidebar {
  width: 230px; min-height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
}
.sidebar-logo { padding: 24px 22px 18px; border-bottom: 1px solid var(--border); }
.sidebar-logo .mark {
  font-family: var(--font-head); font-weight: 700;
  font-size: 22px; letter-spacing: -0.02em; color: var(--accent);
}
.sidebar-logo .mark .dot { display: none; } /* legacy, no longer used */
.sidebar-logo .sub {
  font-size: 10px; color: var(--muted);
  letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;
  font-weight: 600;
}
.nav-section { padding: 16px 0; flex: 1; overflow-y: auto; }
.nav-label {
  padding: 12px 22px 4px; font-size: 9px;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); font-weight: 700;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 22px; cursor: pointer;
  color: var(--muted2); font-size: 13px; font-weight: 500;
  transition: all 0.15s; border-left: 3px solid transparent;
  user-select: none;
}
.nav-item:hover { color: var(--ink); background: var(--hover-bg); }
.nav-item.active {
  color: var(--accent); background: var(--accent-soft);
  border-left-color: var(--accent); font-weight: 600;
}
.nav-item .icon {
  font-size: 15px; width: 18px; text-align: center;
}
.nav-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 9px; padding: 2px 5px; border-radius: 999px;
  font-weight: 500;
}
.sidebar-footer {
  padding: 14px 22px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.avatar {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-weight: 700; font-size: 13px;
}
.user-info { flex: 1; overflow: hidden; }
.user-name {
  font-size: 13px; color: var(--ink); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-role { font-size: 10px; color: var(--muted); }
.logout-btn {
  background: none; border: none; color: var(--muted);
  font-size: 17px; padding: 4px; border-radius: 4px;
  transition: color 0.15s;
}
.logout-btn:hover { color: var(--danger); }

/* ─── MAIN ───────────────────────────────────────────────────── */
.main {
  margin-left: 230px; flex: 1;
  display: flex; flex-direction: column; min-height: 100vh;
}
.topbar {
  height: 56px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 28px; gap: 16px;
  position: sticky; top: 0; z-index: 50;
}
.page-title {
  font-family: var(--font-head); font-size: 16px; font-weight: 600;
  flex: 1; letter-spacing: -0.01em;
}
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.online-dot {
  display: inline-block; width: 8px; height: 8px;
  background: var(--success); border-radius: 50%;
  margin-right: 6px;
}

/* ─── BUTTONS ────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 6px;
  font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); background: var(--card);
  color: var(--ink); transition: all 0.15s; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary {
  background: var(--accent); border-color: var(--accent);
  color: #fff; font-weight: 700;
}
.btn.primary:hover:not(:disabled) {
  background: var(--accent2); border-color: var(--accent2); color: #fff;
}
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover:not(:disabled) { opacity: 0.85; color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 11px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.content { padding: 24px 28px; flex: 1; }
.page { display: none; }
.page.active { display: block; }

/* ─── STAT CARDS ─────────────────────────────────────────────── */
.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 16px; margin-bottom: 28px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px;
  position: relative; overflow: hidden;
  transition: border-color 0.2s;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04);
}
.stat-card:hover { border-color: var(--accent); }
.stat-card::after {
  content: ''; position: absolute; top: 0; right: 0;
  width: 60px; height: 60px;
  border-radius: 0 10px 0 100%;
  opacity: 0.12;
  background: var(--accent);
}
.stat-card:nth-child(1)::after { background: var(--accent); }
.stat-card:nth-child(2)::after { background: var(--accent2); }
.stat-card:nth-child(3)::after { background: var(--success); }
.stat-card:nth-child(4)::after { background: var(--danger); }
.stat-label {
  font-size: 10px; color: var(--muted);
  letter-spacing: 1px; text-transform: uppercase;
  font-weight: 600;
}
.stat-value {
  font-family: var(--font-head); font-size: 32px; font-weight: 700;
  margin: 8px 0 4px; line-height: 1; color: var(--ink);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.stat-cur {
  font-size: 0.55em; font-weight: 700; color: var(--muted);
  margin-right: 3px; letter-spacing: 0;
}
.stat-delta { font-size: 10px; color: var(--muted); }

/* ─── PANEL ──────────────────────────────────────────────────── */
.panel {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; margin-bottom: 18px;
}
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 10px;
}
.panel-title {
  font-family: var(--font-head); font-size: 13px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--ink);
}
.panel-body { padding: 0; }

/* ─── TABLE ──────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  padding: 11px 16px; text-align: left;
  font-size: 9px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted);
  background: var(--hover-bg);
  border-bottom: 1px solid var(--border);
  white-space: nowrap; font-weight: 700;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--soft-bg); }
tbody td { padding: 12px 16px; vertical-align: middle; color: var(--ink); }

/* ─── FILTERS ────────────────────────────────────────────────── */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-input {
  padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--card);
  color: var(--ink); font-size: 12px;
  min-width: 120px;
}
.filter-input:focus { outline: none; border-color: var(--accent); }

/* ─── BADGES ─────────────────────────────────────────────────── */
.badge {
  display: inline-block; padding: 3px 9px;
  border-radius: 999px; font-size: 10px;
  font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
}
.badge.pending     { background: var(--warning-soft); color: var(--warning); }
.badge.assigned    { background: var(--accent-soft);  color: var(--accent); }
.badge.accepted    { background: var(--accent-soft);  color: var(--accent); }
.badge.in_progress { background: var(--gold-soft);    color: var(--gold); }
.badge.completed   { background: var(--success-soft); color: var(--success); }
.badge.cancelled   { background: var(--danger-soft);  color: var(--danger); }
.badge.rejected    { background: var(--danger-soft);  color: var(--danger); }
.badge.unpaid      { background: var(--danger-soft);  color: var(--danger); }
.badge.partial     { background: var(--warning-soft); color: var(--warning); }
.badge.paid        { background: var(--success-soft); color: var(--success); }
.badge.confirmed   { background: var(--success-soft); color: var(--success); }
.badge.disputed    { background: var(--danger-soft);  color: var(--danger); }
.badge.admin       { background: var(--accent-soft);  color: var(--accent); }
.badge.team_leader { background: var(--accent-soft);  color: var(--accent); }
.badge.customer    { background: var(--soft-bg);      color: var(--muted2); }
.badge.active      { background: var(--success-soft); color: var(--success); }
.badge.inactive    { background: var(--danger-soft);  color: var(--danger); }

.serial-pill {
  display: inline-block;
  padding: 3px 8px; border-radius: 5px;
  background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-mono); font-weight: 600;
  font-size: 12px;
}

/* ─── MODALS ─────────────────────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(26,29,26,0.5); z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); border-radius: 12px;
  max-width: 540px; width: 100%;
  max-height: 90vh; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 48px -16px rgba(0,0,0,0.3);
}
.modal-header {
  padding: 18px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title {
  font-family: var(--font-head); font-size: 15px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--ink);
}
.modal-close {
  background: none; border: none; color: var(--muted);
  font-size: 18px; padding: 4px 8px; border-radius: 4px;
}
.modal-close:hover { color: var(--ink); }
.modal-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 22px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

/* ─── FORMS ──────────────────────────────────────────────────── */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row.three { grid-template-columns: repeat(3, 1fr); }
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 10px;
  text-transform: uppercase; letter-spacing: 1.2px;
  font-weight: 700; color: var(--muted); margin-bottom: 5px;
}
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px; background: var(--card);
  color: var(--ink); font-size: 13px;
  transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: var(--accent);
}
.form-textarea { resize: vertical; min-height: 60px; }
.form-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
.form-error { font-size: 11px; color: var(--danger); margin-top: 4px; }

/* ─── EMPTY STATES ───────────────────────────────────────────── */
.empty-row td {
  text-align: center; padding: 32px;
  color: var(--muted); font-style: italic;
}

/* ─── TOAST ──────────────────────────────────────────────────── */
#toasts {
  position: fixed; bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 300; pointer-events: none;
}
.toast {
  background: var(--ink); color: #fff;
  padding: 12px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  animation: toast-in 0.25s ease-out;
  max-width: 360px;
}
.toast.success { background: var(--success); }
.toast.error   { background: var(--danger); }
@keyframes toast-in {
  from { transform: translateX(20px); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}

/* ─── LOGIN SCREEN ───────────────────────────────────────────── */
#loginScreen {
  display: none; position: fixed; inset: 0;
  background:
    radial-gradient(120% 80% at 50% 0%, var(--accent-soft) 0%, transparent 55%),
    var(--bg);
  z-index: 500;
  align-items: center; justify-content: center;
  padding: 20px;
}
#loginScreen.active { display: flex; }
.login-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 32px 28px;
  max-width: 380px; width: 100%;
  box-shadow: 0 20px 60px -20px rgba(0,0,0,0.2);
}
.login-brand { text-align: center; margin-bottom: 28px; }
.login-logo {
  font-family: var(--font-head); font-weight: 700;
  font-size: 28px; color: var(--accent); letter-spacing: -0.02em;
  line-height: 1;
}
.login-sub {
  font-size: 11px; color: var(--muted);
  letter-spacing: 2px; text-transform: uppercase;
  font-weight: 600; margin-top: 6px;
}
.login-field { margin-bottom: 14px; }
.login-field label {
  display: block; font-size: 10px;
  letter-spacing: 1.2px; text-transform: uppercase;
  font-weight: 700; color: var(--muted); margin-bottom: 5px;
}
.login-field input {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px; background: var(--bg);
  font-size: 15px; color: var(--ink);
  transition: border-color 0.15s;
}
.login-field input:focus { outline: none; border-color: var(--accent); background: var(--card); }
#loginError {
  color: var(--danger); font-size: 12px;
  text-align: center; min-height: 18px; margin: 8px 0;
}
#loginBtn {
  width: 100%; padding: 13px;
  background: var(--accent); border: none;
  color: #fff; font-weight: 700; font-size: 14px;
  border-radius: 8px; transition: background 0.15s;
}
#loginBtn:hover:not(:disabled) { background: var(--accent2); }
#loginBtn:disabled { opacity: 0.5; }

/* ─── UTILITY ────────────────────────────────────────────────── */
.muted { color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; }

/* Highlight an unpaid amount in reports so the eye lands on it. Used
 * in report tables where we show both Paid and Unpaid columns side
 * by side; the unpaid column is what an admin would want to chase. */
.amt-unpaid {
  color: var(--danger, #b91c1c);
  font-weight: 700;
}
</style>
</head>

<body>

<!-- ─── LOGIN ─────────────────────────────────────────────── -->
<div id="loginScreen" class="active">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">✈ AirVAS</div>
      <div class="login-sub">Admin Portal</div>
    </div>
    <div class="login-field">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="username"
        placeholder="admin@airportvas.ae">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input id="loginPass" type="password" autocomplete="current-password"
        placeholder="••••••••">
    </div>
    <div id="loginError"></div>
    <button id="loginBtn">Sign in</button>
  </div>
</div>

<!-- ─── SIDEBAR ───────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar" style="display:none">
  <div class="sidebar-logo">
    <div class="mark">✈ AirVAS</div>
    <div class="sub">Admin · UAE Airports</div>
  </div>
  <nav class="nav-section">
    <div class="nav-label">Overview</div>
    <div class="nav-item active" data-page="dashboard"><span class="icon">⬡</span> Dashboard</div>

    <div class="nav-label">Operations</div>
    <div class="nav-item" data-page="orders"><span class="icon">◈</span> Orders</div>
    <div class="nav-item" data-page="team-leaders"><span class="icon">◎</span> Team Leaders</div>
    <div class="nav-item" data-page="employees"><span class="icon">◐</span> Employees</div>

    <div class="nav-label">Finance</div>
    <div class="nav-item" data-page="handovers">
      <span class="icon">⇄</span> Payment handovers
      <span class="nav-badge" id="handovers-badge" hidden>0</span>
    </div>
    <div class="nav-item" data-page="handovers-history">
      <span class="icon">⌛</span> Handover history
    </div>
    <div class="nav-item" data-page="payments"><span class="icon">◆</span> Payments</div>
    <div class="nav-item" data-page="reports"><span class="icon">▦</span> Reports</div>

    <div class="nav-label">Configuration</div>
    <div class="nav-item" data-page="services"><span class="icon">⊞</span> Services</div>
  </nav>
  <div class="sidebar-footer">
    <div class="avatar" id="adminAvatar">A</div>
    <div class="user-info">
      <div class="user-name" id="adminName">Admin</div>
      <div class="user-role">Administrator</div>
    </div>
    <button class="logout-btn" title="Sign out" id="logoutBtn">⏻</button>
  </div>
</aside>

<!-- ─── MAIN ──────────────────────────────────────────────── -->
<main class="main" id="mainContent" style="display:none">
  <header class="topbar">
    <div class="page-title" id="pageTitle">Dashboard</div>
    <div class="topbar-actions">
      <span style="font-size:11px;color:var(--muted);font-weight:600">
        <span class="online-dot"></span>LIVE
      </span>
      <button class="btn" id="refreshBtn">↻ Refresh</button>
    </div>
  </header>

  <div class="content">
    <section class="page active" id="page-dashboard"></section>
    <section class="page" id="page-orders"></section>
    <section class="page" id="page-team-leaders"></section>
    <section class="page" id="page-employees"></section>
    <section class="page" id="page-handovers"></section>
    <section class="page" id="page-handovers-history"></section>
    <section class="page" id="page-payments"></section>
    <section class="page" id="page-reports"></section>
    <section class="page" id="page-services"></section>
    <section class="page" id="page-locations"></section>
  </div>
</main>

<div id="toasts"></div>

<script type="module" src="/admin/app.js"></script>

</body>
</html>
